name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check; empty uses the triggering event's commit
        required: false
        type: string
        default: ""
      release_tag:
        description: Optional release tag whose version must match the distributions
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  MLX_ENABLE_TF32: "0"

jobs:
  checks:
    name: ${{ matrix.runner }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            python: "3.12"
            mlx: false
          - runner: ubuntu-24.04
            python: "3.14"
            mlx: false
          # GitHub documents macos-15 as arm64; Metal coverage depends on the host.
          - runner: macos-15
            python: "3.12"
            mlx: true
    steps:
      - name: Check out the selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.28"
          python-version: ${{ matrix.python }}
          enable-cache: false

      - name: Check public source contents before execution
        run: uv run --no-project --no-sync --python "${{ matrix.python }}" python scripts/package/privacy.py --source

      - name: Install locked dependencies
        run: uv sync --locked --extra inference --extra server --group examples ${{ matrix.mlx && '--extra mlx' || '' }}

      - name: Check types, style, and regressions
        run: uv run --no-sync python scripts/checks/main.py ${{ matrix.mlx && '--require-mlx' || '' }}

      - name: Build and check distributions
        if: matrix.runner == 'ubuntu-24.04' && matrix.python == '3.12'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          uv build --no-build-isolation
          if [[ -n "$RELEASE_TAG" ]]; then
            uv run --no-sync python scripts/package/check.py dist --tag "$RELEASE_TAG"
          else
            uv run --no-sync python scripts/package/check.py dist
          fi

      - name: Retain the checked distributions
        if: matrix.runner == 'ubuntu-24.04' && matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Check test report contents before retaining them
        id: report-privacy
        if: always()
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          from scripts.package.privacy import check_text
          for name in ("tests.xml", "coverage.xml", "coverage.json"):
              path = Path("artifacts") / name
              if path.is_file():
                  check_text(name, path.read_bytes())
          PY

      - name: Retain test results, including skips
        if: always() && steps.report-privacy.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.runner }}-${{ matrix.python }}
          path: |
            artifacts/tests.xml
            artifacts/coverage.xml
            artifacts/coverage.json
          if-no-files-found: warn
          retention-days: 7
