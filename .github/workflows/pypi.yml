name: Publish to PyPI

# Pushing a v<version> tag on a main commit checks, builds and publishes it.
# A manual run is a dry run of main: the same checks and build, never an upload.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Serialize releases; never cancel a publication that may have partially uploaded.
concurrency:
  group: release-pypi
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Resolve the release commit and version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Check out the tagged commit or main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Match the commit to main and the tag to the project version
        id: tag
        env:
          WORKFLOW_EVENT: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import tomllib

          if os.environ["WORKFLOW_REPOSITORY"] != "teilomillet/wyat":
              raise SystemExit("Release only from teilomillet/wyat")
          ref = os.environ["WORKFLOW_REF"]
          if os.environ["WORKFLOW_EVENT"] == "push":
              tag = ref.removeprefix("refs/tags/")
              if tag == ref or not re.fullmatch(r"v[0-9][0-9A-Za-z.!+-]*", tag):
                  raise SystemExit("Publish only from a pushed v<version> tag")
              revision = f"refs/tags/{tag}^{{commit}}"
          elif ref == "refs/heads/main":
              tag = None
              revision = "HEAD^{commit}"
          else:
              raise SystemExit("Select main when dispatching a dry run")
          commit = subprocess.check_output(
              ["git", "rev-parse", "--verify", revision], text=True
          ).strip()
          subprocess.run(
              ["git", "merge-base", "--is-ancestor", commit, "origin/main"],
              check=True,
          )
          metadata = subprocess.check_output(
              ["git", "show", f"{commit}:pyproject.toml"], text=True
          )
          project = tomllib.loads(metadata)["project"]
          version = project["version"]
          tag = tag or f"v{version}"
          if project["name"] != "wyat" or tag != f"v{version}":
              raise SystemExit("Tag must match wyat's pyproject.toml version exactly")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"commit={commit}\ntag={tag}\nversion={version}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"Release candidate: `{tag}` at `{commit}`\n")
          PY

  checks:
    name: Check and build the selected commit
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}
      release_tag: ${{ needs.prepare.outputs.tag }}

  publish:
    name: Publish the checked distributions
    needs: [prepare, checks]
    if: github.event_name == 'push' && vars.PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/wyat/
    permissions:
      id-token: write
    steps:
      # No checkout, package installation, project imports, or rebuild in this job.
      - name: Download this run's checked distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-distributions
          path: checked

      - name: Verify exact bytes and reject an existing PyPI version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import re
          import shutil
          import urllib.error
          import urllib.request

          directory = Path("checked")
          files = {path.name: path for path in directory.iterdir()}
          manifest = files.pop("SHA256SUMS")
          if len(files) != 2 or not all(path.is_file() for path in files.values()):
              raise SystemExit("Expected exactly one wheel and one source archive")
          if sum(name.endswith(".whl") for name in files) != 1:
              raise SystemExit("Expected exactly one wheel")
          if sum(name.endswith(".tar.gz") for name in files) != 1:
              raise SystemExit("Expected exactly one source archive")
          expected = {}
          for line in manifest.read_text(encoding="utf-8").splitlines():
              match = re.fullmatch(r"([0-9a-f]{64})  ([^/\\]+)", line)
              if match is None or match[2] in expected:
                  raise SystemExit("Invalid or duplicate checksum entry")
              expected[match[2]] = match[1]
          if set(expected) != set(files):
              raise SystemExit("Checksum inventory differs from downloaded files")
          for name, path in files.items():
              if hashlib.sha256(path.read_bytes()).hexdigest() != expected[name]:
                  raise SystemExit(f"Checksum mismatch: {name}")
          version = os.environ["RELEASE_VERSION"]
          try:
              with urllib.request.urlopen(
                  f"https://pypi.org/pypi/wyat/{version}/json", timeout=15
              ):
                  raise SystemExit(f"wyat {version} already exists on PyPI")
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          Path("dist").mkdir()
          for name, path in files.items():
              shutil.move(path, Path("dist") / name)
          PY

      - name: Publish through PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: false
          attestations: true
