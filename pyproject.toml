[project]
name = "wyat"
version = "0.0.1"
description = "Local decision-model inference, evaluation, and serving"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.urls]
Repository = "https://github.com/teilomillet/wyat"
Issues = "https://github.com/teilomillet/wyat/issues"

[tool.hatch.build.targets.wheel]
packages = ["wyat"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["artifacts/**", "**/*.trace/**", "**/*.gputrace/**", "**/*.raw.xml", "**/*.tensors.safetensors"]

[project.optional-dependencies]
inference = ["torch>=2.5,<3", "transformers>=5.17,<6", "safetensors>=0.5,<1"]
server = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
mlx = ["mlx>=0.30,<0.33; sys_platform == 'darwin' and platform_machine == 'arm64'", "mlx-lm>=0.30,<0.32; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
wyat = "wyat.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "hypothesis>=6,<7",
    "httpx>=0.28,<1",
    "ruff>=0.13,<1",
    "mypy>=1.15,<2",
    "pytest-cov>=7,<8",
    "twine>=7,<8",
    "hatchling>=1.27,<2",
    "pyyaml>=6,<7",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["wyat"]

[tool.coverage.run]
branch = true
source = ["wyat"]
data_file = "artifacts/.coverage"

[tool.coverage.report]
show_missing = true
precision = 2
