[project.optional-dependencies]
inference = ["torch>=2.5,<3", "transformers>=5.17,<6", "safetensors>=0.5,<1"]
server = ["fastapi>=0.115,<1", "pydantic>=2,<3", "uvicorn>=0.34,<1"]
mlx = ["mlx>=0.31.2,<0.33; sys_platform == 'darwin' and platform_machine == 'arm64'", "mlx-lm>=0.31,<0.32; sys_platform == 'darwin' and platform_machine == 'arm64'", "transformers>=5.17,<6; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
wyat = "wyat.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "hypothesis>=6,<7",
    "httpx>=0.28,<1",
    "jsonschema>=4,<5",
    "ruff>=0.13,<1",
    "mypy>=1.15,<2",
    "pytest-cov>=7,<8",
    "twine>=7,<8",
    "hatchling>=1.27,<2",
    "pyyaml>=6,<7",
    "ordeal>=0.3.43",
]
# Libraries the integration examples plug into; CI installs them so those
# examples are type-checked and tested instead of skipped.
examples = [
    "langchain-core>=1.6,<2",
    "langgraph>=1.2,<2",
    "llama-index-core>=0.14,<0.15",
    "rank-bm25>=0.2,<0.3",
    "mcp>=2.3,<3",
    "pandas>=3,<4",
    "pandas-stubs>=3,<4",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["tests"]
files = ["wyat"]

[[tool.mypy.overrides]]
module = "wyat.input_rendering"
disable_error_code = ["no-any-return", "operator"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["wyat"]
data_file = "artifacts/.coverage"

[tool.coverage.report]
show_missing = true
precision = 2
