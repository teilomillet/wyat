[project]
name = "wyat"
version = "0.1.1"
description = "Local decision-model inference, evaluation, and serving"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Teïlo Millet" }]
keywords = ["decision model", "classification", "routing", "llm", "local inference", "french"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Natural Language :: French",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://wyat.io"
Documentation = "https://wyat.io/docs/"
Repository = "https://github.com/teilomillet/wyat"
Issues = "https://github.com/teilomillet/wyat/issues"

[tool.hatch.build.targets.wheel]
bypass-selection = true
dev-mode-dirs = ["."]

[tool.hatch.build.hooks.custom]
path = "scripts/package/hatch.py"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

